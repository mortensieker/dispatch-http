name: Release

on:
  push:
    tags: [v*]

jobs:
  build:
    permissions:
      contents: write

    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-22.04
          - platform: darwin/universal
            os: macos-latest
          - platform: windows/amd64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -ldflags "-X main.version=${{ github.ref_name }}"
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/bin
          zip -r "../../dispatch-${{ matrix.os }}.zip" .

      - uses: softprops/action-gh-release@v2
        if: runner.os != 'Windows'
        with:
          files: dispatch-${{ matrix.os }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        if: runner.os == 'Windows'
        with:
          files: build/bin/Dispatch.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
